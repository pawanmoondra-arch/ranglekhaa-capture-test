<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#263b2f"><link rel="manifest" href="manifest.json"><title>Ranglekhaa Capture</title><style>
body{margin:0;background:#f6f5f0;color:#263b2f;font-family:Arial,sans-serif}main{max-width:580px;margin:auto;padding:20px 16px 50px}.top{display:flex;justify-content:space-between}.brand{font-size:25px;font-weight:700;letter-spacing:2px}.sub,.user,.help,.note{color:#667069;font-size:13px}.user{text-align:right;font-size:11px}.label{font-weight:700;margin:16px 0 7px}select{width:100%;padding:14px;border:1px solid #dddcd5;border-radius:10px;background:#fff;font-size:16px}.box,.card,.msg{background:#fff;border:1px solid #dddcd5;border-radius:12px;padding:15px;margin-top:14px}.progress{height:8px;background:#e6e6e0;border-radius:8px;margin:9px 0}.bar{height:100%;background:#263b2f}.section{margin-top:23px;font-size:13px;font-weight:700;letter-spacing:1px}.card h3{margin:0 0 5px}.req{font-size:11px;font-weight:700}.optional{color:#667069}.row{display:flex;gap:8px}.btn,.action{border:0;border-radius:9px;padding:13px;font-size:15px}.btn{flex:1}.dark,.lock{background:#263b2f;color:#fff}.light,.unlock,.cancel,.view{background:#e9e9e3;color:#263b2f}.action{width:100%;margin-top:9px}.preview{display:none;width:100%;max-height:300px;object-fit:contain;margin-top:10px;border-radius:9px}input[type=file]{display:none}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eeeae1;font-size:11px;font-weight:700;margin-top:5px}.ok{background:#dfe9e1;color:#2e6b45}.locked{background:#e3e7e3}.msg{display:none}.bad{color:#9b2c2c}
</style></head><body><main><div class="top"><div><div class="brand">RANGLEKHAA</div><div class="sub">Product Capture</div></div><div class="user"><select id="who" style="padding:6px;border-radius:8px;border:1px solid #dddcd5;font-size:11px"><option value="nsoni9068@gmail.com">Naveen — Partner</option><option value="pawanmoondra@gmail.com">Pawan — Partner & Admin</option></select><div id="user"></div></div></div><button id="install" class="action light" style="display:none;margin-top:12px">📲 INSTALL APP</button>
<div class="label">Article Number</div><select id="article"><option>Loading articles...</option></select><div class="label">Capture Stage</div><select id="stage"><option value="DEVELOPMENT">Development</option><option value="FINISHED">Finished Product</option></select><div id="summary"></div><div id="photos"></div><div id="msg" class="msg"></div></main><script>
const BACKEND_URL="https://script.google.com/macros/s/AKfycbwVoV4Sgjzxoc30sZ4QSV0qrtjckSZsKBWKAM0rNxGtY1T8BNZFWLSXnETT89KyY_Bj/exec",PARTNER="nsoni9068@gmail.com",ADMIN="pawanmoondra@gmail.com";
let user=localStorage.getItem("rkl_user")||PARTNER,role=user.toLowerCase()===ADMIN?"PARTNER & ADMIN":"PARTNER",state=null,photos={};
const R={DEVELOPMENT:[["COLOUR_OPTIONS","Colour Options",1,"All approved colour options together."],["EMBROIDERY_SAMPLE","Approved Embroidery Sample",1,"Approved embroidery/value-addition sample."]],FINISHED:[["FINISHED_01","Full Product — Front",1,"Clear full-product photograph."],["FINISHED_02","Back / Overall",1,"Back or overall product view."],["FINISHED_03","Embroidery / Work Detail",1,"Clear workmanship/detail close-up."],["FINISHED_04","Fabric / Texture Close-up",1,"Fabric texture, print or finish."],["FINISHED_05","Dupatta / Important Component",0,"Optional significant component."],["FINISHED_06","Colour Options / Assortment",0,"Optional colour assortment."]]};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function show(x,b){let e=document.getElementById("msg");e.style.display="block";e.className="msg "+(b?"bad":"");e.innerHTML=x}
async function GET(a,article){let u=BACKEND_URL+"?action="+a+"&t="+Date.now()+(article?"&article="+encodeURIComponent(article):"");let r=await fetch(u,{cache:"no-store"}),t=await r.text();let d;try{d=JSON.parse(t)}catch(e){throw Error("Backend returned HTML instead of JSON. Check the /exec URL and Web App access.")}if(!d.success)throw Error(d.error);return d}
async function POST(d){await fetch(BACKEND_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)});return true}
async function articles(){try{let d=await GET("articles"),s=document.getElementById("article");s.innerHTML='<option value="">Select Article Number</option>';d.articles.forEach(a=>{let o=document.createElement("option");o.value=a.articleNo;o.textContent=a.articleNo;s.appendChild(o)})}catch(e){show(esc(e.message),true)}}
async function load(){let a=document.getElementById("article").value;if(!a){state=null;photos={};render();return}try{let d=await GET("status",a);state=d.status;photos={};d.captures.photos.forEach(p=>photos[p.stage+"|"+p.photoType]=p);render()}catch(e){show(esc(e.message),true)}}
function render(){let s=document.getElementById("stage").value,st=state&&state[s];document.getElementById("summary").innerHTML="";document.getElementById("photos").innerHTML="";if(!st)return;let pct=st.requiredTotal?Math.round(st.requiredCaptured/st.requiredTotal*100):100,h='<div class="box"><b>'+s+'</b><div>'+st.requiredCaptured+'/'+st.requiredTotal+' required captures complete</div><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><div class="'+(st.locked?"":"ok")+'">'+(st.locked?"🔒 LOCKED":st.complete?"✓ COMPLETE":"○ INCOMPLETE")+'</div>';if(st.complete&&!st.locked)h+='<button id="lock" class="action lock">SUBMIT & LOCK</button>';if(st.locked&&role==="PARTNER & ADMIN")h+='<button id="unlock" class="action unlock">UNLOCK FOR CORRECTION</button>';h+='</div>';document.getElementById("summary").innerHTML=h;if(document.getElementById("lock"))document.getElementById("lock").onclick=()=>lock(s);if(document.getElementById("unlock"))document.getElementById("unlock").onclick=()=>unlock(s);let q=document.createElement("div");q.className="section";q.textContent=s==="DEVELOPMENT"?"DEVELOPMENT REFERENCES":"FINISHED PRODUCT";document.getElementById("photos").appendChild(q);R[s].forEach(x=>card(s,x[0],x[1],x[2],x[3]))}
function card(s,t,title,required,help){let ex=photos[s+"|"+t],locked=state[s].locked,d=document.createElement("div");d.className="card";d.innerHTML="<h3>"+esc(title)+"</h3><div class='req "+(required?"":"optional")+"'>"+(required?"REQUIRED":"OPTIONAL")+"</div><div class='help'>"+esc(help)+"</div><div class='badge "+(locked?"locked":ex?"ok":"")+"'>"+(locked?"🔒 LOCKED":ex?"✓ CAPTURED":"○ NOT CAPTURED")+"</div>"+(ex?"<div class='note'>Current: "+esc(ex.fileName)+"</div>":"");let cam=document.createElement("input"),gal=document.createElement("input");cam.type=gal.type="file";cam.accept=gal.accept="image/*";cam.capture="environment";let row=document.createElement("div");row.className="row";let cb=document.createElement("button"),gb=document.createElement("button");cb.className="btn dark";cb.textContent=ex?"📷 Replace by Camera":"📷 Take Photo";gb.className="btn light";gb.textContent=ex?"🖼️ Replace from Gallery":"🖼️ Gallery";let img=document.createElement("img");img.className="preview";let save=document.createElement("button");save.className="action lock";save.style.display="none";save.textContent=ex?"REPLACE PHOTO":"SAVE PHOTO";let cancel=document.createElement("button");cancel.className="action cancel";cancel.style.display="none";cancel.textContent="CANCEL";let view=document.createElement("button");view.className="action view";view.style.display=ex?"block":"none";view.textContent="OPEN CURRENT PHOTO";view.onclick=()=>window.open(ex.url,"_blank");if(locked){cb.disabled=gb.disabled=true}else{cb.onclick=()=>cam.click();gb.onclick=()=>gal.click()}function pick(f){if(!f)return;let r=new FileReader();r.onload=e=>{img.src=e.target.result;img.style.display=save.style.display=cancel.style.display="block";img.style.display="block";save.dataset.data=e.target.result};r.readAsDataURL(f)}cam.onchange=()=>pick(cam.files[0]);gal.onchange=()=>pick(gal.files[0]);save.onclick=()=>upload(s,t,save.dataset.data,(cam.files[0]||gal.files[0]),!!ex,save);cancel.onclick=()=>{img.style.display=save.style.display=cancel.style.display="none"};row.append(cb,gb);d.append(cam,gal,row,img,save,cancel,view);document.getElementById("photos").appendChild(d)}
async function upload(s,t,data,file,repl,b){b.disabled=true;b.textContent=repl?"REPLACING...":"SAVING...";await POST({action:repl?"REPLACE":"CREATE",articleNo:document.getElementById("article").value,stage:s,photoType:t,fileName:file.name,mimeType:file.type||"image/jpeg",fileData:data,userEmail:user});show("Photo sent. Verifying...");setTimeout(load,400)}
async function lock(s){let b=document.getElementById("lock");b.disabled=true;b.textContent="LOCKING...";await POST({action:"LOCK",articleNo:document.getElementById("article").value,stage:s,userEmail:user});show("Lock sent. Verifying...");setTimeout(async()=>{await load();if(state&&state[s]&&state[s].locked)show("✓ "+s+" is now LOCKED.");else show("Lock was not confirmed by backend.",true)},1500)}
async function unlock(s){let b=document.getElementById("unlock");b.disabled=true;b.textContent="UNLOCKING...";await POST({action:"UNLOCK",articleNo:document.getElementById("article").value,stage:s,userEmail:user});show("Unlock sent. Verifying...");setTimeout(load,400)}

let deferredInstall=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault(); deferredInstall=e;
  let b=document.getElementById("install"); if(b)b.style.display="block";
});
window.addEventListener("appinstalled",function(){
  let b=document.getElementById("install"); if(b)b.style.display="none";
});
document.getElementById("install").onclick=async function(){
  if(!deferredInstall){show("Use Chrome menu → Add to Home screen / Install app.",false);return;}
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall=null;
  this.style.display="none";
};
document.getElementById("article").onchange=load;document.getElementById("stage").onchange=render;document.getElementById("who").value=user;document.getElementById("who").onchange=function(){user=this.value;localStorage.setItem("rkl_user",user);role=user.toLowerCase()===ADMIN?"PARTNER & ADMIN":"PARTNER";document.getElementById("user").innerHTML=role+"<br>"+esc(user);render()};document.getElementById("user").innerHTML=role+"<br>"+esc(user);articles();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></main></body></html>
