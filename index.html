<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263b2f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ranglekhaa Capture</title>
<style>
:root{--green:#263b2f;--paper:#f6f5f0;--line:#dddcd5;--muted:#667069;--ok:#2e6b45;--bad:#9b2c2c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--green)}
main{max-width:560px;margin:auto;padding:20px 16px 40px}.brand{font-size:24px;font-weight:700;letter-spacing:2px}.sub{color:var(--muted);margin:5px 0 22px}
label{display:block;font-weight:700;margin:14px 0 7px}
select{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.section{margin-top:22px;font-weight:700;font-size:13px;letter-spacing:1px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:14px}
h3{margin:0 0 5px;font-size:18px}.req{font-size:11px;font-weight:700;letter-spacing:.7px}.opt{color:var(--muted)}
.help{font-size:13px;color:var(--muted);line-height:1.4;margin:7px 0 12px}
.row{display:flex;gap:9px}.btn{flex:1;border:0;border-radius:9px;padding:13px 8px;font-size:15px}
.dark{background:var(--green);color:white}.light{background:#e9e9e3;color:var(--green)}
input[type=file]{display:none}.preview{display:none;width:100%;max-height:280px;object-fit:contain;border-radius:9px;margin-top:12px;background:#eee}
.save,.replace{display:none;width:100%;margin-top:9px}.save{background:var(--green);color:#fff}.replace{background:#e9e9e3;color:var(--green)}
.status{margin-top:18px;background:#fff;border:1px solid var(--line);padding:13px;border-radius:10px;line-height:1.45}.ok{color:var(--ok)}.bad{color:var(--bad)}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;margin:3px 0 8px;background:#ecece6}
.badge.ok{background:#dfe9e1;color:var(--ok)}.badge.missing{background:#eeeae1;color:#806f3d}
.install{display:none;margin:14px 0;padding:13px;border-radius:10px;background:#dfe7e1}.install button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--green);color:#fff}
.view{display:none;width:100%;margin-top:8px}.replaceBtn{display:none;width:100%;margin-top:8px;background:#ecece6;color:var(--green)}
.archiveNote{font-size:12px;color:var(--muted);margin-top:7px}
</style>
</head>
<body>
<main>
<div class="brand">RANGLEKHAA</div>
<div class="sub">Product Capture</div>

<div id="installBox" class="install">
<b>Install Ranglekhaa</b>
<p>Add this app to your phone home screen.</p>
<button id="installBtn">INSTALL APP</button>
</div>

<label>Article Number</label>
<select id="article"><option value="">Loading articles...</option></select>

<label>Capture Stage</label>
<select id="stage">
<option value="DEVELOPMENT">Development</option>
<option value="FINISHED">Finished Product</option>
</select>

<div id="photoArea"></div>
<div id="status" class="status" style="display:none"></div>
</main>

<script>
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwE9B1MqWx59bqKOnl_0ojyTxp_Z5yx1L0FIM3_EHHBtozJcpK89nXWxuhngHkGE3VW9Q/exec";
let deferredPrompt=null;
let state={};
let captures={};

const cfg={
DEVELOPMENT:[
["COLOUR_OPTIONS","Colour Options","Required — all approved colour options together.",true],
["EMBROIDERY_SAMPLE","Approved Embroidery Sample","Required — approved embroidery/value-addition sample.",true]],
FINISHED:[
["FINISHED_01","Full Product — Front","Required — clear full-product photograph.",true],
["FINISHED_02","Back / Overall","Required — back or another useful overall view.",true],
["FINISHED_03","Embroidery / Work Detail","Required — clear workmanship/detail close-up.",true],
["FINISHED_04","Fabric / Texture Close-up","Required — show fabric texture, print or finish.",true],
["FINISHED_05","Dupatta / Important Component","Optional — useful if there is a significant component.",false],
["FINISHED_06","Colour Options / Assortment","Optional — all available colours together.",false]]
};

function showStatus(text,bad=false){
  const s=document.getElementById("status");
  s.style.display="block";
  s.className="status "+(bad?"bad":"ok");
  s.innerHTML=text;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

async function loadArticles(){
  const select=document.getElementById("article");
  try{
    const r=await fetch(BACKEND_URL+"?action=articles&v="+Date.now(),{cache:"no-store"});
    const d=await r.json();
    if(!d.success) throw new Error(d.error||"Could not load articles.");
    select.innerHTML='<option value="">Select Article Number</option>';
    (d.articles||[]).forEach(a=>{
      const o=document.createElement("option");
      o.value=a.articleNo;o.textContent=a.articleNo;select.appendChild(o);
    });
    if(d.articles&&d.articles.length) showStatus("Article list loaded.",false);
  }catch(e){
    select.innerHTML='<option value="">Could not load articles</option>';
    showStatus("Could not load Article Numbers.<br><small>"+escapeHtml(e.message)+"</small>",true);
  }
}

async function loadCaptures(){
  const article=document.getElementById("article").value;
  if(!article){captures={};render();return;}
  try{
    const r=await fetch(BACKEND_URL+"?action=captures&article="+encodeURIComponent(article)+"&v="+Date.now(),{cache:"no-store"});
    const d=await r.json();
    if(!d.success) throw new Error(d.error||"Could not load capture status.");
    captures={};
    (d.captures||[]).forEach(x=>captures[x.stage+"|"+x.photoType]=x);
    render();
    showStatus("Capture status updated.",false);
  }catch(e){
    showStatus("Could not load capture status.<br><small>"+escapeHtml(e.message)+"</small>",true);
    render();
  }
}

function render(){
  state={};
  const area=document.getElementById("photoArea");
  area.innerHTML="";
  const stage=document.getElementById("stage").value;
  const heading=document.createElement("div");
  heading.className="section";
  heading.textContent=stage==="DEVELOPMENT"?"DEVELOPMENT REFERENCES":"FINISHED PRODUCT";
  area.appendChild(heading);
  cfg[stage].forEach(x=>createPhotoBox(x[0],x[1],x[2],x[3]));
}

function createPhotoBox(type,title,help,required){
  const d=document.createElement("div");d.className="card";
  const h=document.createElement("h3");h.textContent=title;
  const req=document.createElement("div");req.className="req "+(required?"":"opt");req.textContent=required?"REQUIRED":"OPTIONAL";
  const p=document.createElement("div");p.className="help";p.textContent=help;
  const existing=captures[document.getElementById("stage").value+"|"+type];

  const badge=document.createElement("div");
  badge.className="badge "+(existing?"ok":"missing");
  badge.textContent=existing?"✓ CAPTURED":"○ NOT CAPTURED";

  const note=document.createElement("div");note.className="archiveNote";
  if(existing) note.textContent="Current: "+existing.fileName;

  const cam=document.createElement("input");cam.type="file";cam.accept="image/*";cam.capture="environment";
  const gal=document.createElement("input");gal.type="file";gal.accept="image/*";

  const row=document.createElement("div");row.className="row";
  const cb=document.createElement("button");cb.className="btn dark";cb.textContent=existing?"📷 Take Replacement":"📷 Take Photo";
  const gb=document.createElement("button");gb.className="btn light";gb.textContent="🖼️ Gallery";

  const img=document.createElement("img");img.className="preview";
  const save=document.createElement("button");save.className="btn save";save.textContent=existing?"REPLACE PHOTO":"SAVE PHOTO";
  const rep=document.createElement("button");rep.className="btn replace";rep.textContent="CANCEL";
  const view=document.createElement("button");view.className="btn view light";view.textContent="OPEN CURRENT PHOTO";
  const replaceBtn=document.createElement("button");replaceBtn.className="btn replaceBtn";replaceBtn.textContent="REPLACE PHOTO";

  if(existing){
    view.style.display="block";
    replaceBtn.style.display="block";
    view.onclick=()=>{ if(existing.url) window.open(existing.url,"_blank"); };
    replaceBtn.onclick=()=>{cam.click();};
  }

  cb.onclick=()=>cam.click();gb.onclick=()=>gal.click();
  cam.onchange=()=>pick(type,cam.files[0],img,save,rep);
  gal.onchange=()=>pick(type,gal.files[0],img,save,rep);
  save.onclick=()=>{if(state[type]) uploadPhoto(type,state[type],save,!!existing)};
  rep.onclick=()=>{state[type]=null;img.style.display="none";save.style.display="none";rep.style.display="none";cam.value="";gal.value=""};

  row.append(cb,gb);
  d.append(h,req,badge,note,cam,gal,row,img,save,rep,view,replaceBtn);
  document.getElementById("photoArea").appendChild(d);
}

function pick(type,file,img,save,rep){
  if(!file)return;
  if(!file.type.startsWith("image/")){showStatus("Please select an image.",true);return;}
  state[type]=file;
  const rd=new FileReader();
  rd.onload=e=>{
    img.src=e.target.result;img.style.display="block";
    save.style.display="block";rep.style.display="block";
    showStatus("Review the new photo before saving.",false);
  };
  rd.readAsDataURL(file);
}

function uploadPhoto(type,file,button,isReplacement){
  const article=document.getElementById("article").value;
  const stage=document.getElementById("stage").value;
  if(!article){showStatus("Please select an Article Number first.",true);return;}

  button.disabled=true;button.textContent=isReplacement?"REPLACING...":"SAVING...";
  const reader=new FileReader();

  reader.onload=async e=>{
    const payload={
      action:isReplacement?"REPLACE":"CREATE",
      articleNo:article,stage:stage,photoType:type,
      fileName:file.name,mimeType:file.type||"image/jpeg",
      fileData:e.target.result
    };
    try{
      await fetch(BACKEND_URL,{
        method:"POST",mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(payload)
      });
      button.disabled=false;button.textContent=isReplacement?"REPLACED ✓":"SAVED ✓";
      showStatus(isReplacement
        ?"✓ Replacement sent. The old photo is archived and the new photo will become active."
        :"✓ Photo sent to the backend.",false);
      setTimeout(loadCaptures,1800);
    }catch(error){
      button.disabled=false;button.textContent=isReplacement?"REPLACE PHOTO":"SAVE PHOTO";
      showStatus("Upload failed: "+escapeHtml(error.message),true);
    }
  };
  reader.onerror=()=>{
    button.disabled=false;button.textContent=isReplacement?"REPLACE PHOTO":"SAVE PHOTO";
    showStatus("Could not read the selected photo.",true);
  };
  reader.readAsDataURL(file);
}

document.getElementById("article").onchange=loadCaptures;
document.getElementById("stage").onchange=()=>{render();};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("installBox").style.display="block";});
document.getElementById("installBtn").onclick=async()=>{if(deferredPrompt){await deferredPrompt.prompt();deferredPrompt=null;document.getElementById("installBox").style.display="none";}};
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(console.error);
document.addEventListener("DOMContentLoaded",()=>{render();loadArticles();});
</script>
</main>
</body>
</html>
