<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263b2f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ranglekhaa Capture</title>
<style>
:root{--g:#263b2f;--p:#f6f5f0;--l:#dddcd5;--m:#667069;--ok:#2e6b45;--bad:#9b2c2c;--gold:#806f3d}
*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Arial,sans-serif;color:var(--g)}
main{max-width:560px;margin:auto;padding:20px 16px 40px}.brand{font-size:24px;font-weight:700;letter-spacing:2px}.sub{color:var(--m);margin:5px 0 22px}
label{display:block;font-weight:700;margin:14px 0 7px}
select{width:100%;padding:14px;border:1px solid var(--l);border-radius:10px;background:#fff;font-size:16px}
.summary,.card,.userbox{background:#fff;border:1px solid var(--l);border-radius:12px;padding:15px;margin-top:14px}
.section{margin-top:22px;font-weight:700;font-size:13px;letter-spacing:1px}
h3{margin:0 0 5px;font-size:18px}.req{font-size:11px;font-weight:700}.opt{color:var(--m)}
.help{font-size:13px;color:var(--m);line-height:1.4;margin:7px 0 12px}
.row{display:flex;gap:9px}.btn{flex:1;border:0;border-radius:9px;padding:13px 8px;font-size:15px}
.dark{background:var(--g);color:#fff}.light{background:#e9e9e3;color:var(--g)}
input[type=file]{display:none}.preview{display:none;width:100%;max-height:280px;object-fit:contain;border-radius:9px;margin-top:12px;background:#eee}
.action{width:100%;border:0;border-radius:9px;padding:13px;margin-top:9px;font-size:15px}
.lock{background:var(--g);color:#fff}.unlock{background:#e9e9e3;color:var(--g)}
.save{background:var(--g);color:#fff;display:none}.cancel,.view{background:#e9e9e3;color:var(--g);display:none}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;margin:3px 0 8px;background:#eeeae1;color:var(--gold)}
.badge.ok{background:#dfe9e1;color:var(--ok)}.badge.locked{background:#e3e7e3;color:var(--g)}
.progress{height:8px;background:#e6e6e0;border-radius:10px;overflow:hidden;margin:9px 0}.bar{height:100%;background:var(--g)}
.complete{color:var(--ok);font-weight:700}.incomplete{color:var(--gold);font-weight:700}
.status{margin-top:18px;background:#fff;border:1px solid var(--l);padding:13px;border-radius:10px;line-height:1.45}.bad{color:var(--bad)}
.note{font-size:12px;color:var(--m);margin-top:7px}.userbox{font-size:13px;color:var(--m)}
.install{display:none;margin:14px 0;padding:13px;border-radius:10px;background:#dfe7e1}.install button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--g);color:#fff}
</style>
</head>
<body>
<main>
<div class="brand">RANGLEKHAA</div>
<div class="sub">Product Capture</div>

<div class="userbox">
<b>Access:</b> <span id="roleLabel"></span>
</div>

<div id="installBox" class="install">
<b>Install Ranglekhaa</b>
<p>Add this app to your phone home screen.</p>
<button id="installBtn">INSTALL APP</button>
</div>

<label>Article Number</label>
<select id="article"><option value="">Loading articles...</option></select>

<label>Capture Stage</label>
<select id="stage">
<option value="DEVELOPMENT">Development</option>
<option value="FINISHED">Finished Product</option>
</select>

<div id="summary"></div>
<div id="photoArea"></div>
<div id="status" class="status" style="display:none"></div>
</main>

<script>
const BACKEND_URL="https://script.google.com/macros/s/AKfycbxnuQl_iNCepgizcTJTecRQHQT2B7sjo6IprfiwLb9hsOHVfpw1pu2ploI81YGasa0loA/exec";
const PARTNER_EMAIL="nsoni9068@gmail.com";
const ADMIN_EMAIL="pawanmoondra@gmail.com";

let userEmail=localStorage.getItem("rkl_partner_user")||PARTNER_EMAIL;
let role=userEmail.toLowerCase()===ADMIN_EMAIL.toLowerCase()?"PARTNER & ADMIN":"PARTNER";
let statusData=null,captures={},state={},deferredPrompt=null;

const cfg={
DEVELOPMENT:[
["COLOUR_OPTIONS","Colour Options","Required — all approved colour options together.",true],
["EMBROIDERY_SAMPLE","Approved Embroidery Sample","Required — approved embroidery/value-addition sample.",true]],
FINISHED:[
["FINISHED_01","Full Product — Front","Required — clear full-product photograph.",true],
["FINISHED_02","Back / Overall","Required — back or another useful overall view.",true],
["FINISHED_03","Embroidery / Work Detail","Required — clear workmanship/detail close-up.",true],
["FINISHED_04","Fabric / Texture Close-up","Required — show fabric texture, print or finish.",true],
["FINISHED_05","Dupatta / Important Component","Optional — useful if there is a significant component.",false],
["FINISHED_06","Colour Options / Assortment","Optional — all available colours together.",false]]
};

function showStatus(text,bad=false){
 const s=document.getElementById("status");
 s.style.display="block";
 s.className="status "+(bad?"bad":"");
 s.innerHTML=text;
}
function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function updateRole(){
 document.getElementById("roleLabel").textContent=role;
}

async function apiGet(action,article){
 const url=BACKEND_URL+"?action="+encodeURIComponent(action)+(article?"&article="+encodeURIComponent(article):"")+"&v="+Date.now();
 const r=await fetch(url,{cache:"no-store"});
 const d=await r.json();
 if(!d.success)throw Error(d.error||"Backend error.");
 return d;
}

async function apiPost(payload){
 const r=await fetch(BACKEND_URL,{
   method:"POST",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify(payload)
 });
 const d=await r.json();
 if(!d.success)throw Error(d.error||"Backend error.");
 return d;
}

async function loadArticles(){
 try{
   const d=await apiGet("articles");
   const sel=document.getElementById("article");
   sel.innerHTML='<option value="">Select Article Number</option>';
   (d.articles||[]).forEach(a=>{
     const o=document.createElement("option");
     o.value=a.articleNo;o.textContent=a.articleNo;sel.appendChild(o);
   });
 }catch(e){
   showStatus("Could not load articles: "+esc(e.message),true);
 }
}

async function loadStatus(){
 const article=document.getElementById("article").value;
 if(!article){statusData=null;captures={};render();return;}

 try{
   const sd=await apiGet("status",article);
   statusData=sd.status;

   const cd=await apiGet("captures",article);
   captures={};
   (cd.captures.photos||[]).forEach(x=>{
     captures[x.stage+"|"+x.photoType]=x;
   });

   render();
 }catch(e){
   showStatus("Could not load status: "+esc(e.message),true);
   render();
 }
}

function render(){
 const stage=document.getElementById("stage").value;
 document.getElementById("photoArea").innerHTML="";
 renderSummary(stage);

 const h=document.createElement("div");
 h.className="section";
 h.textContent=stage==="DEVELOPMENT"?"DEVELOPMENT REFERENCES":"FINISHED PRODUCT";
 document.getElementById("photoArea").appendChild(h);

 cfg[stage].forEach(x=>createBox(...x));
}

function renderSummary(stage){
 const s=document.getElementById("summary");
 s.innerHTML="";
 if(!statusData)return;

 const st=statusData[stage];
 const pct=st.requiredTotal?Math.round(st.requiredCaptured/st.requiredTotal*100):100;
 const label=st.locked?"🔒 LOCKED":st.complete?"✓ COMPLETE":"○ INCOMPLETE";

 let html='<div class="summary">';
 html+='<b>'+(stage==="DEVELOPMENT"?"Development":"Finished Product")+'</b>';
 html+='<div style="margin-top:6px">'+st.requiredCaptured+'/'+st.requiredTotal+' required captures complete</div>';
 html+='<div class="progress"><div class="bar" style="width:'+pct+'%"></div></div>';
 html+='<div class="'+(st.complete?'complete':'incomplete')+'">'+label+'</div>';

 if(st.complete && !st.locked){
   html+='<button class="action lock" id="lockBtn">SUBMIT & LOCK</button>';
   html+='<div class="note">Once locked, Partner access cannot change this stage. Partner & Admin can unlock if correction is required.</div>';
 }

 if(st.locked && role==="PARTNER & ADMIN"){
   html+='<button class="action unlock" id="unlockBtn">UNLOCK FOR CORRECTION</button>';
   html+='<div class="note">Admin override: unlock, correct, then lock again.</div>';
 }

 if(st.locked && role!=="PARTNER & ADMIN"){
   html+='<div class="note">Locked. Partner & Admin access is required to unlock this stage.</div>';
 }

 html+='</div>';
 s.innerHTML=html;

 const lb=document.getElementById("lockBtn");
 const ub=document.getElementById("unlockBtn");

 if(lb)lb.onclick=()=>lockStage(stage,lb);
 if(ub)ub.onclick=()=>unlockStage(stage,ub);
}

function createBox(type,title,help,required){
 const stage=document.getElementById("stage").value;
 const existing=captures[stage+"|"+type];
 const locked=statusData && statusData[stage] && statusData[stage].locked;

 const d=document.createElement("div");
 d.className="card";

 d.innerHTML='<h3>'+title+'</h3>'+
   '<div class="req '+(required?"":"opt")+'">'+(required?"REQUIRED":"OPTIONAL")+'</div>'+
   '<div class="help">'+help+'</div>'+
   '<div class="badge '+(locked?"locked":existing?"ok":"")+'">'+(locked?"🔒 LOCKED":existing?"✓ CAPTURED":"○ NOT CAPTURED")+'</div>'+
   (existing?'<div class="note">Current: '+esc(existing.fileName)+'</div>':"");

 const cam=document.createElement("input");
 cam.type="file";cam.accept="image/*";cam.capture="environment";

 const gal=document.createElement("input");
 gal.type="file";gal.accept="image/*";

 const row=document.createElement("div");
 row.className="row";

 const cb=document.createElement("button");
 cb.className="btn dark";
 cb.textContent=existing?"📷 Take Replacement":"📷 Take Photo";

 const gb=document.createElement("button");
 gb.className="btn light";
 gb.textContent="🖼️ Gallery";

 const img=document.createElement("img");
 img.className="preview";

 const save=document.createElement("button");
 save.className="action save";
 save.textContent=existing?"REPLACE PHOTO":"SAVE PHOTO";

 const cancel=document.createElement("button");
 cancel.className="action cancel";
 cancel.textContent="CANCEL";

 const view=document.createElement("button");
 view.className="action view";
 view.textContent="OPEN CURRENT PHOTO";

 if(existing){
   view.style.display="block";
   view.onclick=()=>{if(existing.url)window.open(existing.url,"_blank");};
 }

 if(!locked){
   cb.onclick=()=>cam.click();
   gb.onclick=()=>gal.click();
 }else{
   cb.disabled=true;
   gb.disabled=true;
 }

 cam.onchange=()=>pick(type,cam.files[0],img,save,cancel);
 gal.onchange=()=>pick(type,gal.files[0],img,save,cancel);

 save.onclick=()=>{
   if(state[type])upload(type,state[type],save,!!existing);
 };

 cancel.onclick=()=>{
   state[type]=null;
   img.style.display="none";
   save.style.display="none";
   cancel.style.display="none";
   cam.value="";
   gal.value="";
 };

 row.append(cb,gb);
 d.append(cam,gal,row,img,save,cancel,view);
 document.getElementById("photoArea").appendChild(d);
}

function pick(type,file,img,save,cancel){
 if(!file)return;
 if(!file.type.startsWith("image/")){
   showStatus("Please select an image.",true);return;
 }
 state[type]=file;

 const r=new FileReader();
 r.onload=e=>{
   img.src=e.target.result;
   img.style.display="block";
   save.style.display="block";
   cancel.style.display="block";
   showStatus("Review the photo before saving.",false);
 };
 r.readAsDataURL(file);
}

async function upload(type,file,button,replacement){
 const article=document.getElementById("article").value;
 const stage=document.getElementById("stage").value;

 button.disabled=true;
 button.textContent=replacement?"REPLACING...":"SAVING...";

 const r=new FileReader();

 r.onload=async e=>{
   try{
     const d=await apiPost({
       action:replacement?"REPLACE":"CREATE",
       articleNo:article,
       stage:stage,
       photoType:type,
       fileName:file.name,
       mimeType:file.type||"image/jpeg",
       fileData:e.target.result,
       userEmail:userEmail
     });

     button.textContent=replacement?"REPLACED ✓":"SAVED ✓";
     showStatus("✓ "+d.result.action+" completed.",false);
     state[type]=null;
     setTimeout(loadStatus,700);
   }catch(err){
     button.disabled=false;
     button.textContent=replacement?"REPLACE PHOTO":"SAVE PHOTO";
     showStatus("Upload failed: "+esc(err.message),true);
   }
 };
 r.readAsDataURL(file);
}

async function lockStage(stage,button){
 const article=document.getElementById("article").value;
 button.disabled=true;
 button.textContent="LOCKING...";

 try{
   const d=await apiPost({
     action:"LOCK",
     articleNo:article,
     stage:stage,
     userEmail:userEmail
   });

   showStatus("✓ "+stage+" is now LOCKED.",false);
   setTimeout(loadStatus,700);
 }catch(e){
   button.disabled=false;
   button.textContent="SUBMIT & LOCK";
   showStatus("Could not lock stage: "+esc(e.message),true);
 }
}

async function unlockStage(stage,button){
 const article=document.getElementById("article").value;
 button.disabled=true;
 button.textContent="UNLOCKING...";

 try{
   await apiPost({
     action:"UNLOCK",
     articleNo:article,
     stage:stage,
     userEmail:userEmail
   });

   showStatus("✓ "+stage+" unlocked for correction.",false);
   setTimeout(loadStatus,700);
 }catch(e){
   button.disabled=false;
   button.textContent="UNLOCK FOR CORRECTION";
   showStatus("Could not unlock stage: "+esc(e.message),true);
 }
}

document.getElementById("article").onchange=loadStatus;
document.getElementById("stage").onchange=render;

window.addEventListener("beforeinstallprompt",e=>{
 e.preventDefault();
 deferredPrompt=e;
 document.getElementById("installBox").style.display="block";
});

document.getElementById("installBtn").onclick=async()=>{
 if(deferredPrompt){
   await deferredPrompt.prompt();
   deferredPrompt=null;
   document.getElementById("installBox").style.display="none";
 }
};

if("serviceWorker" in navigator){
 navigator.serviceWorker.register("sw.js").catch(console.error);
}

document.addEventListener("DOMContentLoaded",()=>{
 updateRole();
 render();
 loadArticles();
});
</script>
</body>
</html>
